      ldap_auth_source: "Kết nối LDAP"
      dn: "DN nhóm LDAP"
      group: "Nhóm OpenProject"
      sync_users: "Đồng bộ thành viên"
      confirm_privileged: "Tôi hiểu rằng việc này có thể ánh xạ một nhóm có đặc quyền (quản trị)"
    sync_run:
      started_at: "Bắt đầu lúc"
      status_label: "Trạng thái"
      added: "Đã thêm"
      removed: "Đã xóa"
      status:
        running: "Đang chạy"
        success: "Thành công"
        failed: "Thất bại"
    actions:
      new_mapping: "Ánh xạ mới"
      edit_mapping: "Sửa ánh xạ"
      sync_now: "Đồng bộ ngay"
      sync_all: "Đồng bộ tất cả ngay"
    flash:
      created: "Đã tạo ánh xạ nhóm LDAP."
