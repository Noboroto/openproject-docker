vi:
  ldap_group_sync:
    menu: "Đồng bộ nhóm LDAP"
    title: "Đồng bộ nhóm LDAP"
    intro: >-
      Ánh xạ nhóm LDAP (theo tên phân biệt DN) sang nhóm OpenProject. Một tác vụ
      theo lịch — và tùy chọn sau mỗi lần đăng nhập LDAP — sẽ phản chiếu thành
      viên nhóm LDAP vào nhóm OpenProject tương ứng. Thay đổi thành viên được áp
      dụng qua các dịch vụ lõi với tư cách người dùng hệ thống.
    recent_runs: "Các lần đồng bộ gần đây"
