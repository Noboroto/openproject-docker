en:
  project_templates:
    menu_caption: "Project templates"
    gallery: "Project templates"
    title: "Project templates"
    intro: >-
      Mark an existing project as a reusable template. Authorized users can then
      create brand-new projects from a template; cloning is performed by
      OpenProject's core copy engine, so hierarchy, custom fields and permissions
      are preserved.
